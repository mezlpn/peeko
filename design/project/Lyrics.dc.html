<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#3B5F0A}a:hover{color:#24400A}
button{font-family:inherit;border:0;padding:0;margin:0;cursor:pointer}
.n{position:relative;background:#050506}
.n::before,.n::after{content:"";position:absolute;top:0;width:10px;height:10px}
.n::before{left:-10px;background:radial-gradient(circle at 0 100%,transparent 9.5px,#050506 10px)}
.n::after{right:-10px;background:radial-gradient(circle at 100% 100%,transparent 9.5px,#050506 10px)}
.xp{width:560px;height:260px;border-radius:0 0 28px 28px;box-shadow:0 8px 24px rgba(0,0,0,.45);padding:6px 20px 18px;display:flex;flex-direction:column;gap:10px;color:#F4F4F1}
.tb{display:flex;align-items:center;justify-content:space-between;height:32px;flex:none}
.tabs{display:flex;gap:2px}
.tab{position:relative;width:32px;height:28px;border-radius:10px;background:transparent;color:#7A7A83;display:flex;align-items:center;justify-content:center}
.tab.on{background:#141417;color:#F4F4F1}
.tab.on::after{content:"";position:absolute;bottom:2px;left:14px;width:4px;height:2px;border-radius:1px;background:#C6F36B}
.ib{width:32px;height:32px;border-radius:10px;background:transparent;color:#A6A6AD;display:flex;align-items:center;justify-content:center}
.mini{display:flex;align-items:center;gap:10px;height:32px;flex:none}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.sk{height:12px;border-radius:6px;background:#1D1D21;animation:pulse 1.2s cubic-bezier(.45,0,.55,1) infinite}
@keyframes search{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.search{display:flex;gap:10px;animation:search 1.4s cubic-bezier(.45,0,.55,1) infinite}
</style>

<div style="width:1280px;height:1080px;padding:56px 48px;background:#F3F2EE;color:#141416;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;gap:24px">

            <div style="height:26px;display:flex;align-items:center;font-size:14px;color:#7A7A83;opacity:.45;transform:scale(.86);transform-origin:left center;white-space:nowrap">Di meja ada kertas biru</div>

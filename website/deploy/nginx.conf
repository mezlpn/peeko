# Contoh nginx untuk website Peeko. Ganti DOMAIN-KAMU dan jalur root, lalu jalankan certbot untuk HTTPS:
#   sudo certbot --nginx -d DOMAIN-KAMU -d www.DOMAIN-KAMU

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN-KAMU www.DOMAIN-KAMU;

    root /var/www/peeko;
    index index.html;

    # /panduan → /panduan/ → panduan/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # CSS/JS/ikon boleh disimpan lama di browser; HTML selalu dicek ulang supaya perubahan langsung terlihat.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    error_page 404 /index.html;
}
